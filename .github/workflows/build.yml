name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find project (unzip app.zip if needed)
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f app.zip ]; then
            unzip -q app.zip -d project
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AIO-Backup-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
